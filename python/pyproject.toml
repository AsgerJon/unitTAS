[build-system]
requires = ["setuptools>=77"]  # 77: the license as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "unittas"
version = "0.1.0.dev0"
description = "Tests that play the real Minecraft: the orchestrator, and the protocol it speaks with the probe in the game"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Asger Jon Vistisen" }]
# the one list of what the package needs: the root's environment.yml installs the package, so it installs these too
dependencies = ["worktoy>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/AsgerJon/unitTAS"

[tool.setuptools.packages.find]
where = ["src"]
